<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link
         rel="stylesheet"
         href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap"
         />
      <style>
         body {
         font-family: "Open Sans", sans-serif;
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         }
         .top-brands-container {
         padding-left: 18px;
         padding-right: 18px;
         position: relative;
         overflow: hidden;
         margin-top: 10px;
         margin-bottom: 10px;
         /* max-width: 840px; */
         }
         .sub-category-dropdown-wrapper {
          display: none;
         }
         .facets-items-collection-view-cell-span6 {
         border-top: none;
         }
         .top-brands-header {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-bottom: 20px;
         }
         .top-brands-header h2 {
         text-align: center;
         width: 100%;
         font-weight: 700;
         }
         .shop-all-btn {
         background-color: #d12b2b;
         color: #fff;
         padding: 4px 20px;
         text-align: center;
         text-decoration: none;
         border-radius: 30px;
         font-weight: 600;
         margin-right: 10px;
         white-space: nowrap;
         width: 30%;
         }
         .brands-list {
         display: flex;
         overflow-x: auto;
         white-space: nowrap;
         justify-content: space-between;
         }
         .facets-items-collection-view-cell-span3 {
         border-top: none !important;
         }
         .brand-item {
         display: inline-block;
         margin: 0 4px;
         border: 1px solid #d8d4d4;
         padding: 10px;
         transition: .6s ease;
         }
         .brand-item:hover {
         transform: scale(1.03);
         padding-top: 1px;
         border: none;
         }
         .brand-item img {
         max-width: 100px;
         height: auto;
         display: block;
         margin: 0 auto 10px;
         }
         .brand-name {
         margin-bottom: 0px;
         text-align: center;
         color: black;
         font-weight: 600;
         font-size: 14px;
         text-transform: none;
         }
         .scroll-arrow {
         position: absolute;
         top: 46%;
         background-color: transparent;
         color: #242424;
         font-size: 30px;
         border: none;
         cursor: pointer;
         }
         .scroll-arrow.left {
         left: 0px;
         }
         .scroll-arrow.right {
         right: 0px;
         }
         @media only screen and (max-width: 1199px) {
         .brand-item {
         width: 120px;
         }
         }
         @media only screen and (max-width: 425px) {
         .title-header {
         margin: 0 !important;
         font-size: 20px !important;
         text-align: center !important;
         }
         .shop-all-btn {
         font-size: 13px;
         margin-right: 0;
         padding: 2px 10px;
         width: 35%;
         }
         .facets-facet-browse-facets {
         display: none !important;
         }
         }
      </style>
   </head>
   <body>
      <div class="plp-ad-img">
        <img style="width: 100%;" src="https://image.primaryarms.com/images/primary-arms/landing-pages/plp-brand-test/StoegerSTR-Series_800x150_General-PA.jpg?updatedAt=1724772162087">
      </div>
      <div class="top-brands-container">
         <div class="top-brands-header">
            <h2 class="title-header">TOP BRANDS</h2>
         </div>
         <button
            class="scroll-arrow left"
            id="scrollLeftArrow"
            onclick="scrollLeftAction()"
            >
         &#10094;
         </button>
         <div class="brands-list" id="brandsList">
            <a href="https://www.primaryarms.com/handguns/semi-automatic-pistols/brand/glock" class="brand-link">
               <div class="brand-item">
                  <img
                     src="https://image.primaryarms.com/images/primary-arms/landing-pages/plp-brand-test/brand-glock?updatedAt=1724333882944"
                     alt="Glock"
                     style="height: 67px;"
                     />
                  <h3 class="brand-name">Glock</h3>
               </div>
            </a>
            <a href="https://www.primaryarms.com/handguns/semi-automatic-pistols/brand/sig-sauer" class="brand-link">
               <div class="brand-item">
                  <img
                     src="https://image.primaryarms.com/images/primary-arms/landing-pages/plp-brand-test/brand-sig-sauer?updatedAt=1724333927329"
                     alt="Sig Sauer"
                     style="height: 67px;"
                     />
                  <h3 class="brand-name">Sig Sauer</h3>
               </div>
            </a>
            <a href="https://www.primaryarms.com/handguns/semi-automatic-pistols/brand/cz-usa" class="brand-link">
               <div class="brand-item">
                  <img
                     src="https://image.primaryarms.com/images/primary-arms/landing-pages/plp-brand-test/brand-cz-usa?updatedAt=1724333976610"
                     alt="CZ USA"
                     style="height: 67px;"
                     />
                  <h3 class="brand-name">CZ USA</h3>
               </div>
            </a>
            <a href="https://www.primaryarms.com/handguns/semi-automatic-pistols/brand/canik" class="brand-link">
               <div class="brand-item">
                  <img
                     src="https://image.primaryarms.com/images/primary-arms/landing-pages/plp-brand-test/brand-canik?updatedAt=1724334021453"
                     alt="Canik"
                     style="height: 67px;"
                     />
                  <h3 class="brand-name">Canik</h3>
               </div>
            </a>
            <a href="https://www.primaryarms.com/brand/smith-and-wesson" class="brand-link">
               <div class="brand-item">
                  <img
                     src="https://image.primaryarms.com/images/primary-arms/landing-pages/plp-brand-test/SM13567_00.webp?updatedAt=1725915581636"
                     alt="Smith & Wesson"
                     style="height: 67px;"
                     />
                  <h3 class="brand-name">Smith & Wesson</h3>
               </div>
            </a>
            <a href="https://www.primaryarms.com/handguns/semi-automatic-pistols/brand/walther" class="brand-link">
               <div class="brand-item">
                  <img
                     src="https://image.primaryarms.com/images/primary-arms/landing-pages/plp-brand-test/brand-walther?updatedAt=1724334112838"
                     alt="Walther"
                     style="height: 67px; transform: scaleX(-1);"
                     />
                  <h3 class="brand-name">Walther</h3>
               </div>
            </a>
         </div>
         <button
            class="scroll-arrow right"
            id="scrollRightArrow"
            onclick="scrollRightAction()"
            >
         &#10095;
         </button>
      </div>
      <script>
         const brandsList = document.getElementById("brandsList");
         const scrollLeftArrow = document.getElementById("scrollLeftArrow");
         const scrollRightArrow = document.getElementById("scrollRightArrow");
         
         function updateArrowVisibility() {
            Promise.all(Array.from(brandsList.getElementsByTagName('img')).map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => { img.onload = img.onerror = resolve; });
            })).then(() => {
                void brandsList.offsetWidth;

                const isScrollable = brandsList.scrollWidth > brandsList.clientWidth;
                const isScrolledToStart = brandsList.scrollLeft <= 0;
                const isScrolledToEnd = brandsList.scrollLeft + brandsList.clientWidth >= brandsList.scrollWidth - 1; 

                scrollLeftArrow.style.display = isScrollable && !isScrolledToStart ? "block" : "none";
                scrollRightArrow.style.display = isScrollable && !isScrolledToEnd ? "block" : "none";

              const topBrandsContainer = document.querySelector('.top-brands-container');

              if (isScrolledToStart) {
                  topBrandsContainer.style.paddingLeft = '0';
              } else {
                  topBrandsContainer.style.paddingLeft = scrollLeftArrow.style.display === "block" ? '18px' : '0';
              }

              if (isScrolledToEnd) {
                  topBrandsContainer.style.paddingRight = '0';
              } else {
                  topBrandsContainer.style.paddingRight = scrollRightArrow.style.display === "block" ? '18px' : '0';
              }

            });
          }
         
         function scrollAction(direction) {
           const itemWidth = brandsList.querySelector('.brand-item').offsetWidth;
           brandsList.scrollBy({
             left: direction * (itemWidth + 10),
             behavior: "smooth",
           });
         }
         
         function scrollRightAction() {
           scrollAction(1);
         }
         
         function scrollLeftAction() {
           scrollAction(-1);
         }
         
         function handleGesture() {
           if (touchendX < touchstartX) scrollRightAction();
           if (touchendX > touchstartX) scrollLeftAction();
         }
         
         brandsList.addEventListener("scroll", updateArrowVisibility);
         window.addEventListener("resize", updateArrowVisibility);
         
         let touchstartX = 0;
         let touchendX = 0;
         
         brandsList.addEventListener("touchstart", (event) => {
           touchstartX = event.changedTouches[0].screenX;
         });
         
         brandsList.addEventListener("touchend", (event) => {
           touchendX = event.changedTouches[0].screenX;
           handleGesture();
         });
         
         window.addEventListener('load', () => {
           setTimeout(updateArrowVisibility, 100);
         });
         
         updateArrowVisibility();
           
      </script>
      <script>
         function scrollToElement() {
             const targetElement = document.querySelector('.facets-item-cell-grid-image-wrapper');
             const mobileTarget = document.querySelector('.facets-facet-browse-items');
             
             if (targetElement) {
                 targetElement.scrollIntoView({ behavior: 'smooth' });
             } else if (mobileTarget) {
                 mobileTarget.scrollIntoView({ behavior: 'smooth' });
             }
         }
      </script>
   </body>
</html>
